name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Unit tests (RadarCore on host)
        run: pio test -e native -v

      - name: Build ESP32 firmware
        run: pio run -e esp32dev

      - name: Check dashboard JavaScript
        run: |
          python3 - <<'EOF'
          import re
          html = open("web/index.html", encoding="utf-8").read()
          open("/tmp/dashboard.js", "w", encoding="utf-8").write(re.search(r"<script>([\s\S]*)</script>", html).group(1))
          EOF
          node --check /tmp/dashboard.js

      - name: Firmware size
        run: pio run -e esp32dev -t size

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32dev
          path: .pio/build/esp32dev/firmware.bin
