; Ultrasonic Scanning Radar with Live Web Display
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

; ---------------------------------------------------------------------------
; Firmware for an ESP32 DevKit (ESP32-WROOM-32)
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32 @ 6.9.0          ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    links2004/WebSockets @ ^2.4.1
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    bblanchon/ArduinoJson @ ^7.0.4
; Gzips web/index.html into include/web_page_gen.h before every build
extra_scripts = pre:tools/embed_web.py

; ---------------------------------------------------------------------------
; Host-side unit tests for the signal-processing core (lib/RadarCore)
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
